name: addon-data

# Builds the Temucraft world database from SQL and remakes the data of our addons (What's Training, Loss of
# Control, GatherMate) and the AoWoW changes page, then pushes what changed. See ci/addon-data.sh.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_run:
    workflows: [weekly-module-build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client unzip
      - name: Git can push with the token
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Make the data
        env:
          MYSQL: mysql -h127.0.0.1 -uroot -proot
          DBC_ZIP_URL: ${{ secrets.DBC_ZIP_URL }}
          PUSH: ${{ secrets.FORK_SYNC_TOKEN != '' }}
        run: bash ci/addon-data.sh
